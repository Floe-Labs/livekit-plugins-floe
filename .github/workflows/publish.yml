# Auto-publish (workflow_run on CI success) is intentionally disabled until PYPI_API_TOKEN is added AND the PyPI project-name ownership is settled (see repo README / FLO-748). Enable by restoring the workflow_run trigger.
name: Publish to PyPI

# Manual-only: a maintainer triggers this from the Actions tab once the token
# and PyPI project name are in place. There is deliberately NO workflow_run
# auto-trigger, so a push to main can never accidentally (or fail-loudly) try to
# publish before the project is set up.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the release tag; PyPI auth stays the token secret

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Upgrade pip and install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Read package metadata
        id: meta
        run: |
          PKG_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          PKG_VERSION=$(python -c "import livekit.plugins.floe.version as v; print(v.__version__)")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: check
        run: |
          PKG_NAME="${{ steps.meta.outputs.name }}"
          PKG_VERSION="${{ steps.meta.outputs.version }}"
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PKG_NAME/$PKG_VERSION/json")
          case "$HTTP_CODE" in
            200)
              echo "$PKG_NAME==$PKG_VERSION already published on PyPI, skipping."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "$PKG_NAME==$PKG_VERSION not found on PyPI, will publish."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected PyPI response (HTTP $HTTP_CODE). Failing to avoid incorrect publish."
              exit 1
              ;;
          esac

      - name: Build distribution
        if: steps.check.outputs.should_publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Tag the release
        # Maps the published artifact back to its exact commit. The tag pattern
        # (v<version>) is what the "Release tag protection" ruleset guards.
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v$PKG_VERSION" \
            -f sha="$(git rev-parse HEAD)" \
            || echo "::warning::tag v$PKG_VERSION already exists or could not be created"
